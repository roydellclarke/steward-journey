# Production deploy for the server at stewardpathfinder.com (both A records point
# here). Run ON THAT SERVER:
#
#   1. docker login ghcr.io -u roydellclarke   (GitHub PAT with read:packages)
#   2. put the filled-in .env.production and this Caddyfile next to this file
#   3. docker compose -f docker-compose.prod.yml up -d
#
# Caddy terminates TLS for both hostnames and proxies to the internal containers.
# The frontend has its API URL (https://api.stewardpathfinder.com) compiled in,
# so the browser calls the public API host, which Caddy routes to the backend.
services:
  backend:
    image: ghcr.io/roydellclarke/stewardpath-backend:v0.3.0
    env_file:
      - .env.production
    environment:
      # Caddy is the only way in (the backend publishes no host port), so the
      # X-Forwarded-For it sets is the real client. Without this, uvicorn
      # ignores that header and every request looks like it came from Caddy's
      # own container IP, which collapses every per-IP rate limit in the API
      # into one shared bucket. The subnet is pinned below so this value is
      # deterministic rather than whatever Docker hands out today.
      FORWARDED_ALLOW_IPS: "172.28.0.0/16"
    volumes:
      - stewardpath-data:/data/stewardpath   # durable owner data + auth.db
    restart: unless-stopped
    expose:
      - "8000"
    networks: [edge]

  frontend:
    image: ghcr.io/roydellclarke/stewardpath-frontend:v0.3.0
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"
    networks: [edge]

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data     # persists issued TLS certs across restarts
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks: [edge]

networks:
  edge:
    ipam:
      config:
        # Fixed so FORWARDED_ALLOW_IPS above stays correct across recreates.
        - subnet: 172.28.0.0/16

volumes:
  stewardpath-data:
  caddy-data:
  caddy-config:
