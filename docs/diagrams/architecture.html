<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StewardPath Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Skin: StewardPath's paper, ink and type from frontend/app/theme.css.
       Colour system: one hue per box, and every connector carries the hue of
       the box it enters, so a line can be traced to its destination without
       following it. This deliberately sets aside the one-accent rule in the
       project's CLAUDE.md and in the skill's style guide. What keeps it from
       reading as a rainbow is that all nine hues are desaturated and held to a
       single lightness band (5.26:1 to 7.06:1 on paper), so they differ in hue
       alone and no box outshouts another. Node names stay near-black; the hue
       lives on the border, the type tag and the connector. */
    :root {
      --color-paper:   #faf9f6;
      --color-card:    #ffffff;
      --color-ink:     #15171a;
      --color-muted:   #646a65;
      --color-soft:    #5a615c;

      --hue-client:    #5f5668;   /* slate      6.61:1 */
      --hue-ingress:   #4a6a55;   /* sage       5.73:1 */
      --hue-web:       #4d6a8a;   /* dusty blue 5.33:1 */
      --hue-api:       #36646a;   /* teal       6.26:1 */
      --hue-authdb:    #8a5942;   /* rust       5.56:1 */
      --hue-json:      #7d6329;   /* ochre      5.41:1 */
      --hue-stripe:    #77465f;   /* plum       7.06:1 */
      --hue-mail:      #5d6636;   /* olive      5.83:1 */
      --hue-llm:       #646a65;   /* stone      5.26:1 */

      --font-sans:     'Inter', -apple-system, 'Helvetica Neue', system-ui, sans-serif;
      --font-display:  'Manrope', var(--font-sans);
      --font-mono:     'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1040px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · StewardPath</p>
    <h1>Every request enters through one door</h1>

    <div class="diagram-container">
      <svg viewBox="0 88 1040 612" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sp-architecture-title sp-architecture-desc">
        <title id="sp-architecture-title">StewardPath production architecture</title>
        <desc id="sp-architecture-desc">Caddy terminates TLS for two hostnames and routes by Host header to a Next.js frontend and a FastAPI backend inside a pinned Docker network, where the backend writes to SQLite and per-project JSON and calls Stripe, an email provider, and an optional LLM provider. Each component has its own colour, and every arrow carries the colour of the component it enters.</desc>

        <defs>
          <marker id="to-ingress" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a6a55"/></marker>
          <marker id="to-web" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4d6a8a"/></marker>
          <marker id="to-api" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#36646a"/></marker>
          <marker id="to-authdb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8a5942"/></marker>
          <marker id="to-json" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7d6329"/></marker>
          <marker id="to-stripe" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#77465f"/></marker>
          <marker id="to-mail" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5d6636"/></marker>
          <marker id="to-llm" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#646a65"/></marker>
        </defs>

        <rect x="0" y="88" width="1040" height="612" fill="#faf9f6"/>

        <!-- ZONE: the pinned Docker network. Neutral on purpose, so it frames the
             coloured boxes instead of competing with them. -->
        <rect x="196" y="112" width="568" height="504" rx="8" fill="#15171a" fill-opacity="0.02" stroke="#15171a" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="236" y="116" width="296" height="12" rx="2" fill="#faf9f6"/>
        <text x="384" y="125" fill="#5a615c" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">DOCKER NETWORK · 172.28.0.0/16 · NO HOST PORTS</text>

        <!-- ARROWS, each in the colour of the box it enters. Drawn before nodes. -->

        <!-- browser into Caddy -->
        <line x1="156" y1="336" x2="212" y2="336" stroke="#4a6a55" stroke-width="1.4" marker-end="url(#to-ingress)"/>
        <rect x="158" y="316" width="54" height="12" rx="2" fill="#faf9f6"/>
        <text x="185" y="325" fill="#5a615c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS 443</text>

        <!-- Caddy into the frontend -->
        <path d="M356,312 H374 Q382,312 382,304 V196 Q382,188 390,188 H404" fill="none" stroke="#4d6a8a" stroke-width="1.4" marker-end="url(#to-web)"/>
        <rect x="316" y="244" width="56" height="12" rx="2" fill="#faf9f6"/>
        <text x="372" y="253" fill="#5a615c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">BY HOST</text>

        <!-- Caddy into the backend -->
        <line x1="356" y1="356" x2="404" y2="356" stroke="#36646a" stroke-width="1.4" marker-end="url(#to-api)"/>

        <!-- backend into auth.db -->
        <path d="M468,416 V432 Q468,440 460,440 H406 Q398,440 398,448 V468" fill="none" stroke="#8a5942" stroke-width="1.4" marker-end="url(#to-authdb)"/>

        <!-- backend into the JSON store -->
        <path d="M524,416 V432 Q524,440 532,440 H562 Q570,440 570,448 V468" fill="none" stroke="#7d6329" stroke-width="1.4" marker-end="url(#to-json)"/>

        <!-- backend out to Stripe -->
        <path d="M584,320 H690 Q698,320 698,312 V218 Q698,210 706,210 H808" fill="none" stroke="#77465f" stroke-width="1.4" marker-end="url(#to-stripe)"/>
        <rect x="708" y="256" width="58" height="12" rx="2" fill="#faf9f6"/>
        <text x="708" y="265" fill="#5a615c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">CHECKOUT</text>

        <!-- Stripe's signed webhook back into the backend -->
        <path d="M808,234 H776 Q768,234 768,242 V336 Q768,344 760,344 H588" fill="none" stroke="#36646a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#to-api)"/>
        <rect x="702" y="286" width="56" height="12" rx="2" fill="#faf9f6"/>
        <text x="758" y="295" fill="#5a615c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">WEBHOOK</text>

        <!-- backend out to the email provider -->
        <path d="M584,370 H808" fill="none" stroke="#5d6636" stroke-width="1.4" marker-end="url(#to-mail)"/>

        <!-- backend out to the optional LLM provider -->
        <path d="M584,392 H738 Q746,392 746,400 V490 Q746,498 754,498 H808" fill="none" stroke="#646a65" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#to-llm)"/>
        <rect x="652" y="442" width="84" height="12" rx="2" fill="#faf9f6"/>
        <text x="736" y="451" fill="#5a615c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">OFF BY DEFAULT</text>

        <!-- NODES -->

        <!-- Owner's browser -->
        <rect x="24" y="294" width="132" height="84" rx="6" fill="#5f5668" fill-opacity="0.06" stroke="#5f5668" stroke-width="1.2"/>
        <rect x="36" y="306" width="46" height="11" rx="2" fill="none" stroke="#5f5668" stroke-width="0.8"/>
        <text x="59" y="314" fill="#5f5668" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">CLIENT</text>
        <text x="36" y="338" fill="#15171a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">Owner's browser</text>
        <text x="36" y="354" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">HttpOnly cookie</text>
        <text x="36" y="368" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">SameSite=None</text>

        <!-- Caddy -->
        <rect x="220" y="280" width="136" height="112" rx="6" fill="#4a6a55" fill-opacity="0.06" stroke="#4a6a55" stroke-width="1.2"/>
        <rect x="232" y="292" width="62" height="11" rx="2" fill="none" stroke="#4a6a55" stroke-width="0.8"/>
        <text x="263" y="300" fill="#4a6a55" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">INGRESS</text>
        <text x="232" y="324" fill="#15171a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">Caddy</text>
        <text x="232" y="340" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">TLS · 80, 443</text>
        <text x="232" y="354" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">HSTS · nosniff</text>
        <text x="232" y="368" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">X-Frame: DENY</text>
        <text x="232" y="382" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">sets XFF</text>

        <!-- Next.js frontend -->
        <rect x="404" y="144" width="180" height="88" rx="6" fill="#4d6a8a" fill-opacity="0.06" stroke="#4d6a8a" stroke-width="1.2"/>
        <rect x="416" y="156" width="54" height="11" rx="2" fill="none" stroke="#4d6a8a" stroke-width="0.8"/>
        <text x="443" y="164" fill="#4d6a8a" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">WEB</text>
        <text x="416" y="188" fill="#15171a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">Next.js 15.5.28</text>
        <text x="416" y="204" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">:3000 · standalone</text>
        <text x="416" y="218" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">30 static pages</text>

        <!-- FastAPI backend -->
        <rect x="404" y="296" width="180" height="120" rx="6" fill="#36646a" fill-opacity="0.06" stroke="#36646a" stroke-width="1.2"/>
        <rect x="416" y="308" width="46" height="11" rx="2" fill="none" stroke="#36646a" stroke-width="0.8"/>
        <text x="439" y="316" fill="#36646a" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">API</text>
        <text x="416" y="344" fill="#15171a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">FastAPI</text>
        <text x="416" y="362" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">:8000 · uvicorn</text>
        <text x="416" y="376" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">39 routes</text>
        <text x="416" y="398" fill="#36646a" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Origin-checked writes</text>

        <!-- SQLite auth.db -->
        <rect x="324" y="468" width="148" height="124" rx="6" fill="#8a5942" fill-opacity="0.06" stroke="#8a5942" stroke-width="1.2"/>
        <rect x="336" y="480" width="52" height="11" rx="2" fill="none" stroke="#8a5942" stroke-width="0.8"/>
        <text x="362" y="488" fill="#8a5942" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">STORE</text>
        <text x="336" y="512" fill="#15171a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">SQLite auth.db</text>
        <text x="336" y="528" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">owners, sessions,</text>
        <text x="336" y="542" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">challenges, grants</text>
        <text x="336" y="562" fill="#8a5942" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">HMAC digests only</text>
        <text x="336" y="578" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">6 tables</text>

        <!-- Per-project JSON -->
        <rect x="496" y="468" width="148" height="124" rx="6" fill="#7d6329" fill-opacity="0.06" stroke="#7d6329" stroke-width="1.2"/>
        <rect x="508" y="480" width="52" height="11" rx="2" fill="none" stroke="#7d6329" stroke-width="0.8"/>
        <text x="534" y="488" fill="#7d6329" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">STORE</text>
        <text x="508" y="512" fill="#15171a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">Project JSON</text>
        <text x="508" y="528" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">profile, intake,</text>
        <text x="508" y="542" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">analysis, successors</text>
        <text x="508" y="562" fill="#7d6329" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">atomic writes</text>
        <text x="508" y="578" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">+ audit log</text>

        <text x="484" y="608" fill="#5a615c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ONE DURABLE VOLUME · /data/stewardpath</text>

        <!-- Stripe -->
        <rect x="808" y="168" width="204" height="84" rx="6" fill="#77465f" fill-opacity="0.06" stroke="#77465f" stroke-width="1.2"/>
        <rect x="820" y="180" width="66" height="11" rx="2" fill="none" stroke="#77465f" stroke-width="0.8"/>
        <text x="853" y="188" fill="#77465f" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">EXTERNAL</text>
        <text x="820" y="212" fill="#15171a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">Stripe</text>
        <text x="820" y="228" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">hosted Checkout</text>
        <text x="820" y="242" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">signature verified</text>

        <!-- Email provider -->
        <rect x="808" y="328" width="204" height="84" rx="6" fill="#5d6636" fill-opacity="0.06" stroke="#5d6636" stroke-width="1.2"/>
        <rect x="820" y="340" width="66" height="11" rx="2" fill="none" stroke="#5d6636" stroke-width="0.8"/>
        <text x="853" y="348" fill="#5d6636" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">EXTERNAL</text>
        <text x="820" y="372" fill="#15171a" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">Resend or Postmark</text>
        <text x="820" y="388" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">sign-in code, link</text>
        <text x="820" y="402" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">purchase receipt</text>

        <!-- Optional LLM provider -->
        <rect x="808" y="456" width="204" height="84" rx="6" fill="#646a65" fill-opacity="0.03" stroke="#646a65" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="820" y="468" width="66" height="11" rx="2" fill="none" stroke="#646a65" stroke-width="0.8"/>
        <text x="853" y="476" fill="#646a65" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.18em">OPTIONAL</text>
        <text x="820" y="500" fill="#646a65" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif">DeepSeek / Moonshot</text>
        <text x="820" y="516" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">wording only</text>
        <text x="820" y="530" fill="#646a65" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">never facts</text>

        <!-- LEGEND: the colour rule in words beats nine swatches -->
        <line x1="24" y1="644" x2="1012" y2="644" stroke="#15171a" stroke-opacity="0.12" stroke-width="1"/>

        <text x="24" y="671" fill="#5a615c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">EVERY ARROW CARRIES THE COLOUR OF THE BOX IT ENTERS</text>

        <line x1="540" y1="668" x2="568" y2="668" stroke="#5a615c" stroke-width="1.4"/>
        <text x="576" y="671" fill="#5a615c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">LIVE PATH</text>

        <line x1="700" y1="668" x2="728" y2="668" stroke="#5a615c" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="736" y="671" fill="#5a615c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">RETURN OR OPTIONAL</text>
      </svg>
    </div>
  </div>
</body>
</html>
