<!DOCTYPE html>
<html lang="en">
<head>

  <title>Readiness Bridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #faf9f6; --color-ink: #15171a;
      --color-muted: #646a65; --color-soft: #5a615c; --color-accent: #4a6a55;
      --font-sans: 'Inter', -apple-system, 'Helvetica Neue', system-ui, sans-serif;
      --font-display: 'Manrope', var(--font-sans);
      --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-display); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Waterfall · StewardPath</p>
    <h1>Fixing the worst thing first barely moves the number</h1>

tart"/>\n        <text x="144" y="313.2" fill="#646a65" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">26</text>\n        <line x1="184" y1="321.2" x2="224" y2="321.2" stroke="#15171a" stroke-opacity="0.55" stroke-width="1" data-carry="26"/>\n        <text x="144" y="440" fill="#15171a" font-size="11" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Where they</text>\n        <text x="144" y="454" fill="#15171a" font-size="11" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">start</text>\n        <rect x="224" y="302.2" width="80" height="19.0" fill="#faf9f6"/>\n        <rect x="224" y="302.2" width="80" height="19.0" fill="#646a65" fill-opacity="0.15" stroke="#646a65" stroke-width="1" data-role="delta" data-value="+5" data-name="Operational\nindependence"/>\n        <text x="264" y="294.2" fill="#4a6a55" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+5</text>\n        <line x1="304" y1="302.2" x2="344" y2="302.2" stroke="#15171a" stroke-opacity="0.55" stroke-width="1" data-carry="31"/>\n        <text x="264" y="440" fill="#15171a" font-size="11" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Operational</text>\n        <text x="264" y="454" fill="#15171a" font-size="11" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">independence</text>\n        <rect x="344" y="222.4" width="80" height="79.8" fill="#faf9f6"/>\n        <rect x="344" y="222.4" width="80" height="79.8" fill="#646a65" fill-opacity="0.15" stroke="#646a65" stroke-width="1" data-role="delta" data-value="+21" data-name="Work written\ndown"/>\n        <text x="384" y="214.4" fill="#646a65" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+21</text>\n        <line x1="424" y1="222.4" x2="464" y2="222.4" stroke="#15171a" stroke-opacity="0.55" stroke-width="1" data-carry="52"/>\n        <text x="384" y="440" fill="#15171a" font-size="11" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Work written</text>\n        <text x="384" y="454" fill="#15171a" font-size="11" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">down</text>\n        <rect x="464" y="142.6" width="80" height="79.8" fill="#faf9f6"/>\n        <rect x="464" y="142.6" width="80" height="79.8" fill="#646a65" fill-opacity="0.15" stroke="#646a65" stroke-width="1" data-role="delta" data-value="+21" data-name="Financial\nclarity"/>\n        <text x="504" y="134.6" fill="#646a65" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+21</text>\n        <line x1="544" y1="142.6" x2="584" y2="142.6" stroke="#15171a" stroke-opacity="0.55" stroke-width="1" data-carry="73"/>\n        <text x="504" y="440" fill="#15171a" font-size="11" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Financial</text>\n        <text x="504" y="454" fill="#15171a" font-size="11" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">clarity</text>\n        <rect x="584" y="70.4" width="80" height="72.2" fill="#faf9f6"/>\n        <rect x="584" y="70.4" width="80" height="72.2" fill="#646a65" fill-opacity="0.15" stroke="#646a65" stroke-width="1" data-role="delta" data-value="+19" data-name="Family\nalignment"/>\n        <text x="624" y="62.4" fill="#646a65" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+19</text>\n        <line x1="664" y1="70.4" x2="704" y2="70.4" stroke="#15171a" stroke-opacity="0.55" stroke-width="1" data-carry="92"/>\n        <text x="624" y="440" fill="#15171a" font-size="11" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Family</text>\n        <text x="624" y="454" fill="#15171a" font-size="11" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">alignment</text>\n        <rect x="704" y="40.0" width="80" height="30.4" fill="#faf9f6"/>\n        <rect x="704" y="40.0" width="80" height="30.4" fill="#646a65" fill-opacity="0.15" stroke="#646a65" stroke-width="1" data-role="delta" data-value="+8" data-name="Ready to\nlet go"/>\n        <text x="744" y="32.0" fill="#646a65" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+8</text>\n        <line x1="784" y1="40.0" x2="824" y2="40.0" stroke="#15171a" stroke-opacity="0.55" stroke-width="1" data-carry="100"/>\n        <text x="744" y="440" fill="#15171a" font-size="11" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Ready to</text>\n        <text x="744" y="454" fill="#15171a" font-size="11" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">let go</text>\n        <rect x="824" y="40.0" width="80" height="380.0" fill="#faf9f6"/>\n        <rect x="824" y="40.0" width="80" height="380.0" fill="#15171a" fill-opacity="0.08" stroke="#15171a" stroke-width="1" data-role="total" data-value="100" data-name="Fully\nready"/>\n        <text x="864" y="32.0" fill="#646a65" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">100</text>\n        <text x="864" y="440" fill="#15171a" font-size="11" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Fully</text>\n        <text x="864" y="454" fill="#15171a" font-size="11" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">ready</text>\n        <line x1="24" y1="478" x2="976" y2="478" stroke="#15171a" stroke-opacity="0.12" stroke-width="1"/>\n        <rect x="24" y="494" width="16" height="10" fill="#15171a" fill-opacity="0.08" stroke="#15171a" stroke-width="1"/>\n        <text x="50" y="503" fill="#5a615c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">WHERE THE SCORE STANDS</text>\n        <rect x="300" y="494" width="16" height="10" fill="#646a65" fill-opacity="0.15" stroke="#646a65" stroke-width="1"/>\n        <text x="326" y="503" fill="#5a615c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">WHAT ONE FIX ADDS</text>\n        <line x1="560" y1="499" x2="588" y2="499" stroke="#15171a" stroke-opacity="0.55" stroke-width="1"/>\n        <text x="598" y="503" fill="#5a615c" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">THE RUNNING TOTAL, CARRIED ACROSS</text>
