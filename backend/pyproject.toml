[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stewardpath-backend"
version = "0.3.0"
description = "Standalone FastAPI backend for StewardPath."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "itsdangerous>=2.2.0",
  "slowapi>=0.1.9",
  "httpx>=0.27.0",
  "stripe>=9.0.0"
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
