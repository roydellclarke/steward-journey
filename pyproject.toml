[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Google ADK-style adversarial long-running agent harness."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "PlanGenEval contributors" }
]
dependencies = []

[project.optional-dependencies]
adk = ["google-adk>=1.0.0"]
llm = ["litellm>=1.60.0"]
scheduler = ["prefect>=3.0.0"]
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]
mcp = ["mcp>=1.0.0"]
dev = []

[project.scripts]
agent-harness = "harness.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
